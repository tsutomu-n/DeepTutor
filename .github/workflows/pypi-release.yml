name: PyPI Release

# Triggered when a GitHub Release is published.
# Publishes the full app package with the version derived from the release tag:
#   - deeptutor (Python backend/CLI + packaged Next.js standalone assets)
#
# The CLI-only package is intentionally not published to PyPI; install it from
# a local checkout with `python -m pip install -e ./packaging/deeptutor-cli`.
#
# Expected tag format: vMAJOR.MINOR.PATCH, with PEP 440-compatible suffixes allowed.
# Example: GitHub release tag v1.3.10 -> PyPI version 1.3.10.
#
# PyPI authentication uses Trusted Publishing. Configure the `deeptutor` PyPI
# project to trust this workflow file, then no API token secret is needed.
# Publication is disabled unless the repository owner explicitly sets
# ENABLE_PYPI_RELEASE=true after choosing an unused version and confirming
# ownership of the target PyPI distribution.

on:
  release:
    types: [published]

permissions:
  contents: read
  checks: read
  id-token: write

concurrency:
  group: pypi-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build and Publish PyPI Package
    if: ${{ github.repository == 'tsutomu-n/DeepTutor' && vars.ENABLE_PYPI_RELEASE == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/deeptutor/

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Verify release tag is on main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main --no-tags
          tag="${{ github.event.release.tag_name }}"
          tag_commit="$(git rev-list -n 1 "$tag")"
          if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo "Release tag $tag ($tag_commit) is not on origin/main; refusing to publish to PyPI." >&2
            exit 1
          fi

      - name: Verify release commit acceptance checks
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag_commit="$(git rev-list -n 1 "${{ github.event.release.tag_name }}")"
          check_runs="$(
            gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/commits/${tag_commit}/check-runs" \
              -f per_page=100
          )"
          required_checks=(
            "Test Summary"
          )
          for required_check in "${required_checks[@]}"; do
            if ! jq -e --arg name "$required_check" \
              '[.check_runs[] | select(.name == $name and .status == "completed" and .conclusion == "success")] | length > 0' \
              <<<"$check_runs" >/dev/null; then
              echo "Required successful check missing for $tag_commit: $required_check" >&2
              exit 1
            fi
          done

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade build packaging twine

      - name: Verify release tag matches deeptutor/__version__.py
        id: version
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path
          from packaging.version import Version

          tag = os.environ["RELEASE_TAG"]
          tag_raw = tag[1:] if tag.startswith("v") else tag
          tag_version = str(Version(tag_raw))

          src = Path("deeptutor/__version__.py").read_text(encoding="utf-8")
          match = re.search(r'^__version__\s*=\s*"([^"]+)"', src, re.MULTILINE)
          if not match:
              raise SystemExit(
                  "Could not find __version__ in deeptutor/__version__.py"
              )
          code_version = str(Version(match.group(1)))
          package_name = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["name"]

          if code_version != tag_version:
              raise SystemExit(
                  f"Release tag {tag!r} (normalized {tag_version!r}) does not "
                  f"match deeptutor/__version__.py value {code_version!r}. "
                  "Bump __version__ before tagging."
              )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"version={code_version}\n")
              handle.write(f"package_name={package_name}\n")
          PY
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}

      - name: Refuse an existing PyPI version
        shell: bash
        env:
          PACKAGE_NAME: ${{ steps.version.outputs.package_name }}
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from urllib.error import HTTPError
          from urllib.request import urlopen

          package = os.environ["PACKAGE_NAME"]
          version = os.environ["PACKAGE_VERSION"]
          url = f"https://pypi.org/pypi/{package}/{version}/json"
          try:
              with urlopen(url, timeout=30) as response:
                  response.read(1)
          except HTTPError as exc:
              if exc.code == 404:
                  print(f"PyPI version is available: {package}=={version}")
              else:
                  raise
          else:
              raise SystemExit(
                  f"PyPI already contains {package}=={version}; refusing publication"
              )
          PY

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci --legacy-peer-deps

      - name: Build packaged Web assets
        run: python scripts/prepare_web_package.py
        env:
          NEXT_PUBLIC_API_BASE: __NEXT_PUBLIC_API_BASE_PLACEHOLDER__
          NEXT_PUBLIC_AUTH_ENABLED: __NEXT_PUBLIC_AUTH_ENABLED_PLACEHOLDER__

      - name: Build distributions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/deeptutor
          # Run from /tmp so any repository-local build/ directory cannot shadow
          # PyPA's `build` module during repeated package builds.
          # Wheels are the supported public install artifacts. The full app
          # wheel contains packaged Next.js assets; source distributions would
          # either duplicate those large assets or require a frontend build.
          (cd /tmp && python -m build --wheel --outdir "$GITHUB_WORKSPACE/dist/deeptutor" "$GITHUB_WORKSPACE")

      - name: Verify package metadata
        run: |
          python -m twine check dist/deeptutor/*
          python - <<'PY'
          from pathlib import Path
          expected = "${{ steps.version.outputs.version }}"
          files = {
              "deeptutor": sorted(path.name for path in Path("dist/deeptutor").glob("*")),
          }
          for package, names in files.items():
              print(package)
              print("\n".join(f"  {name}" for name in names))
          required = [
              ("deeptutor", f"deeptutor-{expected}-py3-none-any.whl"),
          ]
          missing = [name for package, name in required if name not in files[package]]
          if missing:
              raise SystemExit(f"Missing expected distributions: {missing}")
          PY

      - name: Validate TJM wheel contents
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t wheels < <(find dist/deeptutor -maxdepth 1 -type f -name '*.whl' -print)
          if [[ "${#wheels[@]}" -ne 1 ]]; then
            echo "Expected exactly one wheel, found ${#wheels[@]}" >&2
            exit 1
          fi
          python scripts/validate_tjm_wheel.py "${wheels[0]}"

      - name: Smoke installed wheel before publication
        shell: bash
        run: |
          set -euo pipefail
          wheel_path="$(find dist/deeptutor -maxdepth 1 -type f -name '*.whl' -print -quit)"
          python -m venv "$RUNNER_TEMP/deeptutor-release-venv"
          "$RUNNER_TEMP/deeptutor-release-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/deeptutor-release-venv/bin/python" -m pip install "$wheel_path"
          "$RUNNER_TEMP/deeptutor-release-venv/bin/python" -m pip check
          python scripts/tjm_distribution_smoke.py launcher \
            --deeptutor "$RUNNER_TEMP/deeptutor-release-venv/bin/deeptutor"

      - name: Publish deeptutor to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/deeptutor/
          print-hash: true
