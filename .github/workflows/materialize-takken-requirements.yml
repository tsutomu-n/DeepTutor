name: Materialize Takken requirements archive

on:
  push:
    branches:
      - codex/takken-exam-prep-requirements-v2.1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout handoff branch
        uses: actions/checkout@v4
        with:
          ref: codex/takken-exam-prep-requirements-v2.1
          fetch-depth: 0

      - name: Reconstruct and verify ZIP
        shell: bash
        run: |
          set -euo pipefail
          STAGE='docs/exam_prep/takken/.zip_upload'
          ZIP='docs/exam_prep/takken/DeepTutor_Takken_ExamPrep_Requirements_Final_2026-08-23.zip'
          SHA='docs/exam_prep/takken/DeepTutor_Takken_ExamPrep_Requirements_Final_2026-08-23.zip.sha256'

          cat \
            "$STAGE/part00.b64" \
            "$STAGE/part01.b64" \
            "$STAGE/part02.b64" \
            "$STAGE/part03.b64" \
            "$STAGE"/r{00..18}.b64 \
            > /tmp/takken-requirements.b64

          test "$(wc -c < /tmp/takken-requirements.b64)" -eq 108444
          base64 --decode /tmp/takken-requirements.b64 > "$ZIP"
          test "$(stat -c%s "$ZIP")" -eq 81332
          echo '48be5edcc4595d685517dc271256c6b9719167b2ee68d9435dafed19bea9481b  '"$ZIP" | sha256sum --check -
          unzip -t "$ZIP"
          printf '%s  %s\n' \
            '48be5edcc4595d685517dc271256c6b9719167b2ee68d9435dafed19bea9481b' \
            'DeepTutor_Takken_ExamPrep_Requirements_Final_2026-08-23.zip' \
            > "$SHA"

      - name: Commit verified archive
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            docs/exam_prep/takken/DeepTutor_Takken_ExamPrep_Requirements_Final_2026-08-23.zip \
            docs/exam_prep/takken/DeepTutor_Takken_ExamPrep_Requirements_Final_2026-08-23.zip.sha256
          git diff --cached --quiet && exit 0
          git commit -m 'docs: add verified Takken ExamPrep requirements archive'
          git push origin HEAD:codex/takken-exam-prep-requirements-v2.1
