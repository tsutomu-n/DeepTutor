# ============================================
# DeepTutor Docker Compose — Pre-built GHCR Image
# ============================================
# Run this fork using its pre-built image from GitHub Container Registry.
# No local build is required after the fork publishes a release image.
#
# Usage:
#   python scripts/docker_compose.py -f docker-compose.ghcr.yml up -d
#
# To pin a specific version:
#   DEEPTUTOR_IMAGE=ghcr.io/tsutomu-n/deeptutor:1.5.8 \
#     python scripts/docker_compose.py -f docker-compose.ghcr.yml up -d
#
# Prerequisites:
#   1. Configure providers in data/user/settings/model_catalog.json or the UI
#   2. Use scripts/docker_compose.py so port mappings are rendered from system.json
#   3. Read the API URL note below before starting
#
# Local LLM (LM Studio / Ollama / vLLM):
#   Use "host.docker.internal" instead of "localhost" in provider base_url fields.
#   Configure provider endpoints in data/user/settings/model_catalog.json or the UI.
#
# ============================================
# IMPORTANT: Frontend-to-Backend API URL
# ============================================
# The browser talks to the Next.js frontend origin. The Next.js server in this
# container proxies /api/* and /ws/* to FastAPI, so a normal single-container
# deployment does not require a public API base URL.
#
# LOCAL deployment (Docker on the same machine you browse from):
#   Open the published frontend port (3782 by default). Port 8001 is published
#   for direct API clients and compatibility, but the browser UI does not need it.
#
# REMOTE SERVER deployment (Docker on a server, accessed from another machine):
#   Point the reverse proxy/TLS endpoint at the frontend port. When auth is
#   enabled, add that exact frontend origin to cors_origins. Configure
#   next_public_api_base only for a split deployment whose backend is on a
#   separate container or host.
# ============================================

services:
  deeptutor:
    image: ${DEEPTUTOR_IMAGE:-ghcr.io/tsutomu-n/deeptutor:latest}
    pull_policy: always
    container_name: deeptutor
    restart: unless-stopped
    ports:
      - "${DEEPTUTOR_DOCKER_BIND_HOST:-127.0.0.1}:${DEEPTUTOR_DOCKER_BACKEND_PORT:-8001}:${DEEPTUTOR_DOCKER_BACKEND_PORT:-8001}"
      - "${DEEPTUTOR_DOCKER_BIND_HOST:-127.0.0.1}:${DEEPTUTOR_DOCKER_FRONTEND_PORT:-3782}:${DEEPTUTOR_DOCKER_FRONTEND_PORT:-3782}"

    volumes:
      # One backup/restore boundary for settings, the shared TJM catalog, every
      # user's learning history, memory, workspaces, and knowledge bases.
      - ./data:/app/data

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${DEEPTUTOR_DOCKER_BACKEND_PORT:-8001}/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    networks:
      - deeptutor-network

networks:
  deeptutor-network:
    driver: bridge
